<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booksy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --text: #0f1419;
      --muted: #6b7280;
      --line: #e5e7eb;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }

    /* Genel iskelet: bilgisayar */
    .shell {
      display: grid;
      grid-template-columns: 240px minmax(0, 600px) 300px;
      justify-content: center;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky; top: 0; height: 100vh;
      padding: 20px 16px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .main { border-right: 1px solid var(--line); min-height: 100vh; }

    .rightbar { padding: 20px 16px; }

    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h3 { margin-bottom: 8px; font-size: 1rem; }
    .panel p { color: var(--muted); font-size: 0.92rem; }

    /* Logo */
    .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .logo-mark { font-size: 1.4rem; }
    .logo-text { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; }
    .logo-dot { font-size: 1.8rem; line-height: 1; }

    /* Menü */
    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav a {
      padding: 12px 16px; border-radius: 999px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .nav a:hover { background: #f3f4f6; }
    .nav a.active, .bottombar a.active { font-weight: 700; }

    /* Sayfa başlığı */
    .page-header {
      position: sticky; top: 0; z-index: 5;
      padding: 16px; background: rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header h2 { font-size: 1.2rem; }

    .notice {
      margin: 16px; padding: 12px 14px;
      background: #f3f4f6; border-radius: 10px;
      font-size: 0.92rem; color: var(--muted);
    }

    /* Formlar ve Gönderi Yazma */
    .auth-box, .composer, .search-wrap, .profile-banner {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .field:focus { border-color: #000; }

    .composer textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font: inherit;
      font-size: 1.05rem;
      min-height: 76px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      background: #000;
      color: #fff;
      border: 1px solid #000;
      padding: 8px 16px;
      border-radius: 999px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-outline {
      background: transparent;
      color: #000;
      border: 1px solid var(--line);
    }
    .btn-outline:hover { background: #f3f4f6; }

    .error-msg {
      color: #dc2626;
      font-size: 0.88rem;
      margin-bottom: 10px;
      display: none;
    }

    /* Gönderi */
    .post {
      display: flex; gap: 12px; padding: 16px;
      border-bottom: 1px solid var(--line);
    }
    .avatar {
      width: 44px; height: 44px; flex-shrink: 0;
      border-radius: 50%; background: #000; color: #fff;
      display: grid; place-items: center; font-weight: 700;
    }
    .post-body { flex: 1; min-width: 0; }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.92rem;
    }
    .post-body p {
      margin-top: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .muted { color: var(--muted); }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 10px;
    }
    .action-btn {
      background: none;
      border: none;
      color: var(--muted);
      font: inherit;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 999px;
    }
    .action-btn:hover { background: #f3f4f6; color: var(--text); }
    .action-btn.liked { color: #e11d48; font-weight: 600; }
    .action-btn.delete:hover { color: #dc2626; }

    /* Alt menü: sadece telefonda görünür */
    .bottombar { display: none; }

    /* Tablet */
    @media (max-width: 1000px) {
      .shell { grid-template-columns: 80px minmax(0, 1fr); }
      .rightbar { display: none; }
      .logo-text, .logo-dot, .sidebar-user { display: none; }
      .nav a { font-size: 0.8rem; padding: 12px 6px; text-align: center; }
    }

    /* Telefon */
    @media (max-width: 700px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .main { border-right: none; padding-bottom: 64px; }

        display: flex; justify-content: space-around;
        position: fixed; bottom: 0; left: 0
