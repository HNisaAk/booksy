<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booksy</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; background: #f9f9f9; }
    .box { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    input, textarea { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; }
    button { background: #1d9bf0; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button.secondary { background: #555; }
    .post { border-bottom: 1px solid #eee; padding: 10px 0; }
    .post small { color: #666; }
  </style>
</head>
<body>

  <h1>📚 Booksy</h1>

  <!-- Giriş / Kayıt Ekranı -->
  <div id="auth-box" class="box">
    <h3>Giriş Yap veya Kayıt Ol</h3>
    <input type="email" id="email" placeholder="E-posta adresin">
    <input type="password" id="password" placeholder="Şifren (en az 6 karakter)">
    <button id="login-btn">Giriş Yap</button>
    <button id="signup-btn" class="secondary">Kayıt Ol</button>
  </div>

  <!-- Gönderi Paylaşma Ekranı (Giriş yapınca görünür) -->
  <div id="post-box" class="box" style="display:none;">
    <p>Hoş geldin, <strong id="user-email"></strong> <button id="logout-btn" class="secondary" style="float:right; padding:5px 10px;">Çıkış</button></p>
    <textarea id="post-text" rows="3" placeholder="Ne okuyorsun veya ne düşünüyorsun?"></textarea>
    <button id="share-btn">Paylaş</button>
  </div>

  <!-- Gönderi Akışı (Feed) -->
  <div class="box">
    <h3>Akış</h3>
    <div id="feed">Yükleniyor...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2CjLHWSKPeTB0HC6AT7AWSNIomHikS3Q",
      authDomain: "booksy-2bca9.firebaseapp.com",
      projectId: "booksy-2bca9",
      storageBucket: "booksy-2bca9.firebasestorage.app",
      messagingSenderId: "854942626548",
      appId: "1:854942626548:web:d778ca1f2e05b08ef4e4a1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authBox = document.getElementById("auth-box");
    const postBox = document.getElementById("post-box");
    const userEmailEl = document.getElementById("user-email");
    const feedEl = document.getElementById("feed");

    // Kayıt Ol
    document.getElementById("signup-btn").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (e) { alert("Hata: " + e.message); }
    };

    // Giriş Yap
    document.getElementById("login-btn").onclick = async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) { alert("Hata: " + e.message); }
    };

    // Çıkış Yap
    document.getElementById("logout-btn").onclick = () => signOut(auth);

    // Kullanıcı durumunu takip et
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authBox.style.display = "none";
        postBox.style.display = "block";
        userEmailEl.textContent = user.email;
      } else {
        authBox.style.display = "block";
        postBox.style.display = "none";
      }
    });

    // Gönderi Paylaş
    document.getElementById("share-btn").onclick = async () => {
      const text = document.getElementById("post-text").value.trim();
      if (!text) return;
      await addDoc(collection(db, "posts"), {
        text: text,
        author: auth.currentUser.email,
        createdAt: serverTimestamp()
      });
      document.getElementById("post-text").value = "";
    };

    // Akışı Canlı Dinle
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      feedEl.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const div = document.createElement("div");
        div.className = "post";
        div.innerHTML = `<small><strong>${data.author}</strong></small><p>${data.text}</p>`;
        feedEl.appendChild(div);
      });
    });
  </script>
</body>
</html>
